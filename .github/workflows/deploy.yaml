name: Deploy Volei Flow
on: # Call event
  push: # This is a PUSH event listener
    branches: [ "main" ] 

jobs: # Jobs will run
  deploy: # This a deploy 
    runs-on: 
      ubuntu-latest # This is a RUN on Ubuntu (LINUX)

    steps: # And this is steps for Deploy!
      - name: Checkout code
        uses: actions/checkout@v4

      - name: SSH Deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -eu

            cd /home/guibs/VoleiFlow
            sudo git stash
            sudo git pull origin main
            sudo npm install
            sudo npm run build

            cd /home/guibs/VoleiFlowApi
            sudo git stash
            sudo git pull origin main

            api_service=""
            api_service_scope=""
            for service in $(systemctl --user list-units --type=service --state=running --no-legend --plain | awk '{print $1}'); do
              working_directory=$(systemctl --user show "$service" --property=WorkingDirectory --value)
              if [ "${working_directory%/}" = "/home/guibs/VoleiFlowApi" ]; then
                api_service="$service"
                api_service_scope="user"
                break
              fi
            done

            if [ -z "$api_service" ]; then
              for service in $(systemctl list-units --type=service --state=running --no-legend --plain | awk '{print $1}'); do
                working_directory=$(systemctl show "$service" --property=WorkingDirectory --value)
                if [ "${working_directory%/}" = "/home/guibs/VoleiFlowApi" ]; then
                  api_service="$service"
                  api_service_scope="system"
                  break
                fi
              done
            fi

            if [ -z "$api_service" ]; then
              echo "Serviço da API não encontrado pelo diretório de trabalho."
              exit 1
            fi

            if [ "$api_service_scope" = "user" ]; then
              systemctl --user restart "$api_service"
              systemctl --user is-active --quiet "$api_service"
            else
              sudo -n systemctl restart "$api_service"
              systemctl is-active --quiet "$api_service"
            fi
            echo "API reiniciada pelo serviço $api_service"
