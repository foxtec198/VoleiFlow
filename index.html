<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link id="app-favicon" rel="icon" type="image/svg+xml" href="/favicon.svg#light" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta id="app-theme-color" name="theme-color" content="#122a23" />
    <meta name="description" content="Inscrições e formação equilibrada de times de vôlei." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VoleiFlow</title>
    <script>
      const savedTheme = localStorage.getItem("voleiflow_theme");
      const initialTheme = savedTheme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.dataset.theme = initialTheme;
      document.querySelector("#app-favicon").href = `/favicon.svg#${initialTheme}`;
      document.querySelector("#app-theme-color").content = initialTheme === "dark" ? "#0d1512" : "#122a23";
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/App.jsx"></script>
  </body>
</html>
